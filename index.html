<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050c14">
  <meta name="description" content="BRICS Masters Moscow 2027. Warface. Онлайн-групповой этап 1–4 марта. LAN-плей-офф 5–7 марта. NoName Cyber Agency.">
  <title>BRICS Masters Moscow 2027 | NoName Cyber Agency</title>

  <style>
    :root {
      --bg: #050c14;
      --panel: #0a1825;
      --text: #edf5fc;
      --muted: #9ab0c3;
      --cyan: #30ddff;
      --line: rgba(110, 177, 216, .22);
      --mono: "Courier New", monospace;
      --poster: none;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 95px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }
    body.locked { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    button, a {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    a:focus-visible, button:focus-visible, summary:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 5px;
    }
    ::selection { background: var(--cyan); color: #041019; }
    img { max-width: 100%; }
    [hidden] { display: none !important; }

    .container {
      width: min(1320px, calc(100% - 56px));
      margin: auto;
    }
    .mono {
      font-family: var(--mono);
      font-size: 10px;
      line-height: 1.6;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }
    .cyan { color: var(--cyan); }
    .muted { color: var(--muted); }

    .grid-background {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 80% 15%, rgba(0, 130, 200, .14), transparent 55%),
        linear-gradient(rgba(110, 177, 216, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110, 177, 216, .035) 1px, transparent 1px);
      background-size: auto, 60px 60px, 60px 60px;
    }
    .progress {
      position: fixed;
      top: 0;
      left: 0;
      width: 0;
      height: 2px;
      z-index: 100;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan);
    }
    .scan {
      position: fixed;
      top: -4px;
      left: 0;
      right: 0;
      height: 2px;
      z-index: 90;
      background: var(--cyan);
      box-shadow: 0 0 35px 8px rgba(48, 221, 255, .2);
      pointer-events: none;
      animation: scan .8s ease-out forwards;
    }

    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      background: rgba(5, 12, 20, .94);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
    }
    .nav {
      min-height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 42px; height: 42px; object-fit: contain; }
    .brand strong { display: block; font-size: 15px; letter-spacing: -.3px; }
    .brand small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 8px;
      letter-spacing: 1.5px;
    }
    .nav-links { display: flex; gap: 22px; }
    .nav-links a {
      font: 10px var(--mono);
      text-transform: uppercase;
      color: #adc2d4;
    }
    .nav-links a:hover { color: var(--cyan); }
    .nav-controls { display: flex; gap: 10px; align-items: center; }
    .lang, .guest-button {
      padding: 11px 13px;
      border: 1px solid var(--line);
      background: #0a1825;
      color: var(--text);
      font: 10px var(--mono);
      text-transform: uppercase;
    }
    .guest-button {
      color: var(--cyan);
      border-color: rgba(48, 221, 255, .4);
    }

    section { padding: 80px 0; }
    .hero { padding: 126px 0 40px; }
    .system-bar {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding-bottom: 20px;
      color: #9fb9ce;
    }
    .status { display: flex; align-items: center; gap: 10px; }
    .dot {
      width: 5px;
      height: 5px;
      flex-shrink: 0;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      animation: pulse 2.4s infinite;
    }
    .hero-grid {
      display: grid;
      grid-template-columns: 1.04fr 1fr;
      gap: 18px;
    }
    .hero-grid > *, .about-grid > *, .company-grid > * { min-width: 0; }

    .hud {
      position: relative;
      border: 1px solid var(--line);
      background: linear-gradient(130deg, rgba(13, 31, 47, .96), rgba(6, 17, 28, .96));
    }
    .hud::before, .hud::after {
      content: "";
      position: absolute;
      width: 24px;
      height: 24px;
      pointer-events: none;
      z-index: 2;
    }
    .hud::before {
      left: -1px;
      top: -1px;
      border-left: 2px solid var(--cyan);
      border-top: 2px solid var(--cyan);
    }
    .hud::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid var(--cyan);
      border-bottom: 2px solid var(--cyan);
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 43px;
      padding: 12px 19px;
      border-bottom: 1px solid var(--line);
      color: #9fbbcf;
    }
    .hero-copy { padding: 34px; }
    h1 {
      font-size: clamp(60px, 6.1vw, 86px);
      line-height: .88;
      font-weight: 900;
      letter-spacing: -.065em;
      margin: 24px 0 16px;
    }
    h1 span { display: block; }
    .outline { color: transparent; -webkit-text-stroke: 1px #96bed8; }
    .city {
      font-size: 26px;
      color: var(--cyan);
      font-weight: 800;
      letter-spacing: -1px;
    }
    .hero-copy p {
      max-width: 430px;
      color: #adc1d3;
      font-size: 14px;
      line-height: 1.85;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 25px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      gap: 20px;
      padding: 15px 18px;
      border: 1px solid var(--cyan);
      background: var(--cyan);
      color: #04131d;
      font: bold 10px var(--mono);
      letter-spacing: .7px;
      text-transform: uppercase;
      clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
      transition: background .2s, transform .2s;
    }
    .btn:hover { background: #8deeff; transform: translateY(-2px); }
    .btn.secondary { background: #0a1b2a; color: var(--text); border-color: #36566d; }
    .btn.secondary:hover { background: #16344a; }
    .hero-bottom {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      border-top: 1px solid var(--line);
      padding: 17px 20px;
      color: #9ab4c8;
    }
    .visual { display: flex; flex-direction: column; }
    .poster-button { border: 0; background: #02070d; padding: 0; width: 100%; }
    .poster-button img { display: block; width: 100%; height: auto; }
    .visual-tools {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 19px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
    }
    .stage-mini {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      align-items: center;
      padding: 22px;
    }
    .stage-mini span { display: block; margin-bottom: 8px; color: var(--cyan); }
    .stage-mini strong {
      display: block;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.6;
    }
    .ticket {
      margin-top: 20px;
      padding: 12px 14px;
      border-left: 2px solid var(--cyan);
      background: rgba(48, 221, 255, .06);
      font-size: 12px;
      line-height: 1.7;
    }

    .ticker {
      overflow: hidden;
      padding: 14px 0;
      border-block: 1px solid var(--line);
      background: rgba(14, 36, 54, .5);
    }
    .ticker-track { display: flex; width: max-content; animation: marquee 35s linear infinite; }
    .ticker-group { display: flex; flex-shrink: 0; }
    .ticker-group span {
      padding: 0 28px;
      color: #a2c7db;
      font: 11px var(--mono);
      letter-spacing: 2px;
      white-space: nowrap;
    }

    .intel { padding: 0; }
    .intel-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .intel-item { padding: 27px 23px; border-right: 1px solid var(--line); }
    .intel-item:first-child { padding-left: 0; }
    .intel-item:last-child { border: 0; }
    .intel-item span { display: block; color: var(--muted); margin-bottom: 10px; }
    .intel-item strong { font-size: 14px; font-weight: 500; line-height: 1.5; }
    .section-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 30px;
      margin-bottom: 30px;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--cyan);
      margin-bottom: 16px;
    }
    .section-label::before {
      content: "";
      width: 20px;
      height: 2px;
      flex-shrink: 0;
      background: var(--cyan);
    }
    h2 {
      font-size: clamp(32px, 4vw, 56px);
      line-height: 1.02;
      letter-spacing: -.045em;
      text-transform: uppercase;
      margin: 0;
    }
    .section-note {
      max-width: 340px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      margin: 26px 0 0;
    }
    .about-grid, .company-grid {
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 50px;
      align-items: center;
    }
    .copy { font-size: 14px; line-height: 1.9; color: #adc1d3; }
    .quote {
      padding: 15px 0 15px 20px;
      border-left: 2px solid var(--cyan);
      margin-top: 25px;
      font-size: 20px;
      line-height: 1.5;
    }
    .operator {
      position: relative;
      height: 350px;
      overflow: hidden;
      background: #06121e;
    }
    .operator::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: var(--poster);
      background-size: auto 160%;
      background-position: left 65%;
      opacity: .8;
    }
    .operator::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #06121e, transparent 80%);
    }
    .reticle {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 45%;
      width: 145px;
      height: 145px;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(48, 221, 255, .6);
      border-radius: 50%;
    }
    .reticle::before, .reticle::after {
      content: "";
      position: absolute;
      background: var(--cyan);
      opacity: .5;
    }
    .reticle::before { left: 50%; top: -20px; width: 1px; height: 185px; }
    .reticle::after { top: 50%; left: -20px; height: 1px; width: 185px; }
    .operator-caption { position: absolute; bottom: 20px; left: 20px; z-index: 1; }

    .banner-section { padding: 0 0 65px; }
    .event-banner {
      position: relative;
      min-height: 430px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #071421;
    }
    .banner-image {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 1s;
    }
    .event-banner:hover .banner-image { transform: scale(1.025); }
    .event-banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(3, 10, 18, .92), rgba(3, 10, 18, .2) 75%),
        linear-gradient(0deg, rgba(3, 10, 18, .8), transparent 65%);
      pointer-events: none;
    }
    .banner-meta {
      position: absolute;
      top: 21px;
      left: 25px;
      right: 25px;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      color: #b3daee;
    }
    .banner-copy {
      position: relative;
      z-index: 1;
      padding: 145px 40px 40px;
      max-width: 690px;
    }
    .banner-copy h2 { font-size: clamp(34px, 4.2vw, 60px); }
    .banner-copy p {
      color: #b6cadc;
      font-size: 14px;
      line-height: 1.8;
      max-width: 470px;
    }
    .banner-two .banner-image { object-position: center 60%; }

    .experience {
      border-block: 1px solid var(--line);
      background: rgba(6, 18, 29, .75);
    }
    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .zone {
      position: relative;
      min-height: 280px;
      padding: 25px;
      border: 1px solid var(--line);
      color: var(--text);
      background: #0a1825;
      text-align: left;
      overflow: hidden;
      transition: transform .25s, border-color .25s;
    }
    .zone:hover { transform: translateY(-4px); border-color: var(--cyan); }
    .zone-number {
      position: absolute;
      top: 45px;
      right: 20px;
      font: bold 90px var(--mono);
      color: rgba(48, 221, 255, .08);
    }
    .zone h3 {
      position: relative;
      font-size: 25px;
      text-transform: uppercase;
      letter-spacing: -.8px;
      margin: 85px 0 12px;
    }
    .zone p {
      position: relative;
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
      margin: 0;
    }
    .zone-arrow { position: absolute; right: 23px; top: 20px; color: var(--cyan); }

    .tabs { display: flex; gap: 10px; margin-bottom: 22px; }
    .tab {
      padding: 13px 20px;
      background: #081421;
      color: var(--muted);
      border: 1px solid var(--line);
      font: 10px var(--mono);
      text-transform: uppercase;
    }
    .tab.active { background: var(--cyan); color: #041019; border-color: var(--cyan); }
    .schedule-item { border-top: 1px solid var(--line); }
    .schedule-item:last-child { border-bottom: 1px solid var(--line); }
    .schedule-item summary {
      display: grid;
      grid-template-columns: 145px 1fr 100px 20px;
      gap: 20px;
      align-items: center;
      padding: 25px 8px;
      list-style: none;
      cursor: pointer;
    }
    summary::-webkit-details-marker { display: none; }
    .schedule-item summary strong { font-size: 19px; font-weight: 500; }
    .schedule-item p {
      margin: 0;
      padding: 0 50px 23px 173px;
      font-size: 13px;
      line-height: 1.8;
      color: var(--muted);
    }
    .plus { color: var(--cyan); font-size: 20px; }
    .schedule-item[open] .plus { transform: rotate(45deg); }
    .note { font-size: 11px; line-height: 1.8; color: #9cb2c4; margin-top: 20px; }

    .gallery { padding-top: 15px; }
    .gallery-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 15px; }
    .scene {
      position: relative;
      min-height: 290px;
      padding: 0;
      border: 1px solid var(--line);
      background: #091523;
      color: var(--text);
      text-align: left;
      overflow: hidden;
    }
    .scene-image {
      position: absolute;
      inset: 0;
      background-image: var(--poster);
      transition: transform .6s;
      background-repeat: no-repeat;
    }
    .scene:nth-child(1) .scene-image { background-size: auto 140%; background-position: center bottom; }
    .scene:nth-child(2) .scene-image { background-size: auto 150%; background-position: left 60%; }
    .scene:nth-child(3) .scene-image { background-size: auto 150%; background-position: right 60%; }
    .scene::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, #04101d, transparent 85%);
    }
    .scene:hover .scene-image { transform: scale(1.07); }
    .scene-top { position: absolute; top: 16px; left: 18px; z-index: 1; color: var(--cyan); }
    .scene-caption { position: absolute; left: 20px; bottom: 23px; z-index: 1; font-size: 22px; }

    .venue-grid { display: grid; grid-template-columns: 1fr 1fr; }
    .venue-copy { padding: 35px; }
    .venue-copy h3 { font-size: 32px; letter-spacing: -1px; margin: 20px 0; }
    .venue-copy p { color: var(--muted); font-size: 14px; line-height: 1.8; }
    .radar-map {
      min-height: 350px;
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-left: 1px solid var(--line);
      background:
        linear-gradient(30deg, transparent 47%, #15344b 48%, #15344b 49%, transparent 50%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, #102b3e 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, #102b3e 40px),
        #06131f;
    }
    .radar {
      width: 230px;
      height: 230px;
      border: 1px solid rgba(48, 221, 255, .3);
      border-radius: 50%;
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 0 0 30px rgba(48, 221, 255, .025), 0 0 0 60px rgba(48, 221, 255, .015);
    }
    .radar-sweep {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(transparent 70%, rgba(48, 221, 255, .23));
      animation: rotate 9s linear infinite;
    }
    .radar-center { position: relative; text-align: center; }
    .radar-center strong { display: block; font: bold 27px var(--mono); letter-spacing: 2px; }
    .map-note {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      color: #a0bdd0;
      text-align: center;
    }

    .company { border-top: 1px solid var(--line); padding-bottom: 35px; }
    .company-lockup { display: flex; align-items: center; gap: 20px; margin-top: 30px; }
    .company-lockup img {
      width: 95px;
      height: 95px;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(48, 221, 255, .2));
    }
    .company-lockup strong { font-size: 24px; font-weight: 500; }
    .company-point {
      display: flex;
      gap: 18px;
      border-top: 1px solid var(--line);
      padding: 17px 0;
      font-size: 13px;
    }
    .company-point span { color: var(--cyan); font-family: var(--mono); }

    .track-record { padding-top: 35px; }
    .case-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .case-card {
      background: #081521;
      border: 1px solid var(--line);
      overflow: hidden;
      transition: border-color .3s;
    }
    .case-card:hover { border-color: rgba(48, 221, 255, .6); }
    .case-photo {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      background: #030a12;
      border: 0;
      overflow: hidden;
      color: var(--text);
    }
    .case-photo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transition: transform .6s;
    }
    .case-photo:hover img { transform: scale(1.04); }
    .case-image-label {
      position: absolute;
      bottom: 18px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      color: #d4f1ff;
      text-shadow: 0 2px 8px #000;
    }
    .case-copy { padding: 28px; }
    .case-copy h3 { margin: 14px 0; font-size: 30px; letter-spacing: -1px; }
    .case-copy p { font-size: 14px; line-height: 1.85; color: var(--muted); margin: 0; }
    .case-tags { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
    .case-tags span {
      padding: 7px 10px;
      border: 1px solid var(--line);
      color: #b9d6e5;
      font-size: 9px;
    }
    .experience-summary {
      margin-top: 22px;
      padding: 25px;
      border-left: 2px solid var(--cyan);
      background: rgba(48, 221, 255, .04);
      font-size: 15px;
      line-height: 1.85;
      color: #bbd1e1;
    }

    .project-team { padding-top: 35px; }
    .team-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: stretch;
      gap: 20px;
    }
    .person {
      position: relative;
      margin: 0;
      display: flex;
      flex-direction: column;
      min-width: 0;
      border: 1px solid var(--line);
      background: #030a10;
      overflow: hidden;
      transition: border-color .3s, transform .3s, box-shadow .3s;
    }
    .person:hover {
      border-color: var(--cyan);
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 120, 170, .1);
    }
    .person-top {
      position: absolute;
      z-index: 2;
      top: 15px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      color: #c0e5f5;
      pointer-events: none;
    }
    .person-top span { padding: 4px 7px; background: rgba(3, 10, 16, .85); }
    .portrait {
      position: relative;
      aspect-ratio: 4 / 5;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 60%, #102c40, #030a10 70%);
    }
    .portrait img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      transition: transform .5s;
    }
    .person:hover .portrait img { transform: scale(1.025); }
    .portrait::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;

                    <span>${t.heroLabel}</span><span class="cyan">WARFACE</span>
                  </div>
                  <div class="hero-copy">
                    <div class="mono cyan">ASTRUM WARFACE / INTERNATIONAL TOURNAMENT</div>
                    <h1><span class="outline">BRICS</span><span>MASTERS</span></h1>
                    <div class="city">MOSCOW ${CONFIG.eventYear}</div>
                    <p>${t.intro}</p>
                    <div class="actions">
                      <a class="btn" href="#schedule">${t.plan}<span aria-hidden="true">↗</span></a>
                      <a class="btn secondary" href="#experience">${t.explore}<span aria-hidden="true">↓</span></a>
                    </div>
                    <div class="ticket" id="ticket" role="status" hidden></div>
                  </div>
                  <div class="hero-bottom mono">
                    <span>${t.organizer} / ${CONFIG.company}</span>
                    <span class="cyan">${CONFIG.eventYear}</span>
                  </div>
                </div>

                <div class="hud visual">
                  <div class="panel-head mono">
                    <span>${t.visual}</span><span class="cyan">KEY VISUAL</span>
                  </div>
                  <button class="poster-button" type="button" data-modal="poster"
                    aria-label="${t.open}: ${t.posterCaption}">
                    <img src="${CONFIG.poster}"
                      alt="${t.posterCaption}: BRICS Masters Moscow 2027" fetchpriority="high">
                  </button>
                  <div class="visual-tools mono">
                    <span>${t.posterCaption}</span><span class="cyan">${t.open} ↗</span>
                  </div>
                  <div class="stage-mini">
                    <div><span class="mono">${t.onlineDates}</span><strong>${t.online}</strong></div>
                    <div><span class="mono">${t.lanDates}</span><strong>${t.lan}</strong></div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <div class="ticker" aria-label="Warface / BRICS Masters / Moscow 2027">
            <div class="ticker-track" aria-hidden="true">
              ${[0, 1].map(() => `<div class="ticker-group">
                <span>ASTRUM WARFACE</span><span>// BRICS MASTERS</span>
                <span>// MARCH 1–7, 2027</span><span>// NONAME CYBER AGENCY</span>
              </div>`).join("")}
            </div>
          </div>

          <section class="intel" aria-label="${t.navigation}">
            <div class="container intel-grid">
              ${intelValues.map((value, index) => `<div class="intel-item">
                <span class="mono">${t.intelLabels[index]}</span><strong>${value}</strong>
              </div>`).join("")}
            </div>
          </section>

          <section id="about">
            <div class="container about-grid">
              <div class="reveal">
                <div class="section-label mono">${t.briefLabel}</div>
                <h2>${t.briefTitle}</h2>
                <div class="copy">${t.briefCopy}</div>
                <div class="quote">${t.quote}</div>
              </div>
              <div class="hud reveal">
                <div class="panel-head mono">
                  <span>TACTICAL IDENTITY</span><span class="cyan">VISUAL / 01</span>
                </div>
                <div class="operator" role="img" aria-label="${t.gallery[1]}">
                  <div class="reticle" aria-hidden="true"></div>
                  <div class="operator-caption mono cyan">${t.tactical}</div>
                </div>
              </div>
            </div>
          </section>

          ${banner(t, 0)}

          <section class="experience" id="experience">
            <div class="container">
              <div class="section-top reveal">
                <div><div class="section-label mono">${t.zonesLabel}</div><h2>${t.zonesTitle}</h2></div>
                <p class="section-note">${t.zonesNote}</p>
              </div>
              <div class="cards">
                ${t.zones.map((zone, index) => `<button class="zone reveal" type="button" data-modal="zone${index}">
                  <span class="zone-number" aria-hidden="true">0${index + 1}</span>
                  <span class="mono cyan">ZONE / 0${index + 1}</span>
                  <span class="zone-arrow" aria-hidden="true">↗</span>
                  <h3>${zone[0]}</h3><p>${zone[1]}</p>
                </button>`).join("")}
              </div>
            </div>
          </section>

          <section id="schedule">
            <div class="container">
              <div class="section-top reveal">
                <div><div class="section-label mono">${t.scheduleLabel}</div><h2>${t.scheduleTitle}</h2></div>
                <p class="section-note">${t.scheduleNote}</p>
              </div>
              <div class="tabs" role="tablist" aria-label="${t.nav[1]}">
                <button class="tab" id="tab-main" type="button" role="tab"
                  aria-controls="scheduleList" data-tab="main">${t.tabs[0]}</button>
                <button class="tab" id="tab-guests" type="button" role="tab"
                  aria-controls="scheduleList" data-tab="guests">${t.tabs[1]}</button>
              </div>
              <div id="scheduleList" role="tabpanel" aria-labelledby="tab-main" tabindex="0"></div>
              <p class="note">${t.scheduleFoot}</p>
            </div>
          </section>

           <section class="gallery">
            <div class="container">
              <div class="section-top reveal">
                <div>
                  <div class="section-label mono">${t.galleryLabel}</div>
                  <h2>${t.galleryTitle}</h2>
                </div>
                <p class="section-note">${t.galleryNote}</p>
              </div>
              <div class="gallery-grid">
                ${t.gallery.map((title, index) => `<button class="scene reveal" type="button"
                  data-modal="poster" aria-label="${t.open}: ${title}">
                  <span class="scene-image" aria-hidden="true"></span>
                  <span class="scene-top mono">FRAME / 0${index + 1}</span>
                  <strong class="scene-caption">${title}</strong>
                </button>`).join("")}
              </div>
            </div>
          </section>

          <section id="venue">
            <div class="container">
              <div class="section-top reveal">
                <div>
                  <div class="section-label mono">${t.venueSection}</div>
                  <h2>${t.venueTitle}</h2>
                </div>
              </div>
              <div class="hud reveal">
                <div class="panel-head mono">
                  <span>${t.venuePanel}</span>
                  <span class="cyan">05–07 / 03 / ${CONFIG.eventYear}</span>
                </div>
                <div class="venue-grid">
                  <div class="venue-copy">
                    <div class="mono cyan">${t.lanDates} / ${CONFIG.eventYear}</div>
                    <h3>${t.venueName}</h3>
                    <p>${t.address}</p>
                    <p>${t.venueCopy}</p>
                    <div class="actions">
                      <a class="btn" href="${mapUrl}" target="_blank" rel="noopener noreferrer">
                        ${t.route}<span aria-hidden="true">↗</span>
                      </a>
                      <button class="btn secondary" type="button" id="shareButton">
                        ${t.share}
                      </button>
                    </div>
                  </div>
                  <div class="radar-map" aria-label="${t.radarNote}">
                    <div class="radar">
                      <div class="radar-sweep" aria-hidden="true"></div>
                      <div class="radar-center">
                        <strong>CSKA</strong>
                        <span class="mono cyan">ARENA / MOSCOW</span>
                      </div>
                    </div>
                    <div class="map-note mono">${t.radarNote}</div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          ${banner(t, 1)}

          <section class="company" id="company">
            <div class="container company-grid">
              <div class="reveal">
                <div class="section-label mono">${t.companyLabel}</div>
                <h2>${t.companyTitle}</h2>
                <div class="company-lockup">
                  <img src="${CONFIG.logo}" alt="NoName Cyber Agency"
                    width="95" height="95" loading="lazy">
                  <strong>NoName<br>Cyber Agency</strong>
                </div>
              </div>
              <div class="reveal">
                <div class="copy">${t.companyCopy}</div>
                ${t.companyPoints.map((point, index) => `<div class="company-point">
                  <span>0${index + 1} /</span>${point}
                </div>`).join("")}
              </div>
            </div>
          </section>

          <section class="track-record" id="track-record">
            <div class="container">
              <div class="section-top reveal">
                <div>
                  <div class="section-label mono">${t.experienceLabel}</div>
                  <h2>${t.experienceTitle}</h2>
                </div>
                <p class="section-note">${t.experienceNote}</p>
              </div>
              <div class="case-grid">${caseCards(t)}</div>
              <div class="experience-summary reveal">${t.experienceSummary}</div>
              <p class="note">${t.experienceImageNote}</p>
            </div>
          </section>

          <section class="project-team" id="project-team">
            <div class="container">
              <div class="section-top reveal">
                <div>
                  <div class="section-label mono">${t.teamLabel}</div>
                  <h2>${t.teamTitle}</h2>
                </div>
                <p class="section-note">${t.teamNote}</p>
              </div>
              <div class="team-grid">${teamCards(t)}</div>
            </div>
          </section>

          <section class="faq" id="faq">
            <div class="container faq-grid">
              <div class="reveal">
                <div class="section-label mono">${t.faqLabel}</div>
                <h2>${t.faqTitle}</h2>
              </div>
              <div class="reveal">
                ${t.faq.map(item => `<details class="faq-item">
                  <summary>${item[0]}</summary>
                  <p>${item[1]}</p>
                </details>`).join("")}
              </div>
            </div>
          </section>

          <section class="final-cta">
            <div class="container">
              <div>
                <div class="mono cyan">BRICS MASTERS / MOSCOW ${CONFIG.eventYear}</div>
                <h2>${t.cta}</h2>
                <p>${t.ctaNote}</p>
              </div>
              <a class="btn" href="#top">
                ${t.back}<span aria-hidden="true">↑</span>
              </a>
            </div>
          </section>
        </main>

        <footer id="contacts">
          <div class="container">
            <div class="footer-grid">
              <div>
                ${brand()}
                <p class="copy">BRICS Masters Moscow ${CONFIG.eventYear}<br>${t.venueName}</p>
                <div class="footer-title mono">${t.contactLabel}</div>
                <a class="footer-contact" href="tel:+79158933807">${CONFIG.phone}</a>
                <a class="footer-contact" href="mailto:${CONFIG.email}">${CONFIG.email}</a>
              </div>

              <div>
                <div class="footer-title mono">${t.documents}</div>
                <button class="legal-button" type="button" data-modal="agreement">
                  ${t.agreement}
                </button>
              </div>

              <div>
                <div class="footer-title mono">${t.navigation}</div>
                <div class="footer-links">
                  <a href="#schedule">${t.nav[1]}</a>
                  <a href="#venue">${t.nav[3]}</a>
                  <a href="#track-record">${t.experienceLabel}</a>
                  <a href="#project-team">Project Team</a>
                  <a href="#faq">${t.faqLabel}</a>
                </div>
              </div>
            </div>

            <div class="footer-bottom">
              <div>© ${CONFIG.copyrightYear} ${CONFIG.company}. ${t.rights}</div>
              <p class="disclaimer">${t.disclaimer}</p>
            </div>
          </div>
        </footer>`;

      document.getElementById("languageButton").addEventListener("click", () => {
        const currentPosition = window.scrollY;
        language = language === "ru" ? "en" : "ru";

        try {
          localStorage.setItem("event-language", language);
        } catch (error) {
          // Переключение языка работает и без localStorage.
        }

        render(true);

        document.getElementById("languageButton").focus({ preventScroll: true });

        const previousScrollBehavior = document.documentElement.style.scrollBehavior;
        document.documentElement.style.scrollBehavior = "auto";
        window.scrollTo(0, currentPosition);
        document.documentElement.style.scrollBehavior = previousScrollBehavior;
      });

      app.querySelectorAll("[data-modal]").forEach(button => {
        button.addEventListener("click", () => openModal(button.dataset.modal));
      });

      const tabs = Array.from(app.querySelectorAll("[data-tab]"));

      tabs.forEach((tab, index) => {
        tab.addEventListener("click", () => renderSchedule(tab.dataset.tab));

        tab.addEventListener("keydown", event => {
          let nextIndex;

          if (event.key === "ArrowRight") nextIndex = (index + 1) % tabs.length;
          if (event.key === "ArrowLeft") nextIndex = (index - 1 + tabs.length) % tabs.length;
          if (event.key === "Home") nextIndex = 0;
          if (event.key === "End") nextIndex = tabs.length - 1;

          if (nextIndex === undefined) return;

          event.preventDefault();
          renderSchedule(tabs[nextIndex].dataset.tab);
          tabs[nextIndex].focus();
        });
      });

      renderSchedule(activeTab);
      applyTicket();

      document.getElementById("shareButton").addEventListener("click", sharePage);

      app.querySelectorAll("img").forEach(image => {
        image.addEventListener("load", updateProgress);
        image.addEventListener("error", () => {
          image.alt = TEXT[language].imageError;
          updateProgress();
        });
      });

      setupReveal(skipAnimation);
      requestAnimationFrame(updateProgress);
    }

    function renderSchedule(key) {
      activeTab = key === "guests" ? "guests" : "main";

      const t = TEXT[language];
      const rows = activeTab === "main" ? t.schedule : t.guestSchedule;
      const list = document.getElementById("scheduleList");

      list.innerHTML = rows.map(row => `<details class="schedule-item">
        <summary>
          <span class="mono cyan">${row[0]}</span>
          <strong>${row[1]}</strong>
          <span class="schedule-badge mono muted">${row[2]}</span>
          <span class="plus" aria-hidden="true">+</span>
        </summary>
        <p>${row[3]}</p>
      </details>`).join("");

      app.querySelectorAll("[data-tab]").forEach(tab => {
        const active = tab.dataset.tab === activeTab;
        tab.classList.toggle("active", active);
        tab.setAttribute("aria-selected", String(active));
        tab.tabIndex = active ? 0 : -1;
      });

      list.setAttribute("aria-labelledby", "tab-" + activeTab);

      list.querySelectorAll("details").forEach(item => {
        item.addEventListener("toggle", updateProgress);
      });

      updateProgress();
    }

    function applyTicket() {
      const code = new URLSearchParams(window.location.search).get("ticket");
      if (!code || !/^[A-Za-z0-9_-]{1,64}$/.test(code)) return;

      const t = TEXT[language];
      const ticket = document.getElementById("ticket");

      ticket.textContent = t.ticketPrefix + code + t.ticketNote;
      ticket.hidden = false;
    }

    function openModal(key) {
      const t = TEXT[language];

      let title = "";
      let body = "";
      let label = "EVENT / BRIEFING";
      let image = "";
      let imageAlt = "";

      if (key === "guest") {
        title = t.guest;
        body = `<p>${t.guestModal}</p>`;
      } else if (key === "agreement") {
        title = t.agreement;
        label = "LEGAL / DRAFT";
        body = t.legal.map(section => `
          <h3>${section[0]}</h3>
          <p>${section[1]}</p>
        `).join("");
      } else if (key === "poster") {
        title = t.posterTitle;
        label = "KEY VISUAL";
        body = `<p>${t.posterText}</p>`;
        image = CONFIG.poster;
        imageAlt = t.posterTitle;
      } else if (/^zone[0-2]$/.test(key)) {
        const index = Number(key.slice(-1));
        title = t.zones[index][0];
        label = "ZONE / 0" + (index + 1);
        body = `<p>${t.zoneModal[index]}</p>`;
      } else if (/^case[0-1]$/.test(key)) {
        const index = Number(key.slice(-1));
        title = t.cases[index][0];
        label = "PROJECT / 0" + (index + 1);
        body = `<p>${t.cases[index][1]}</p><p>${t.experienceImageNote}</p>`;
        image = index === 0 ? CONFIG.astrum : CONFIG.vkplay;
        imageAlt = t.cases[index][2];
      } else {
        return;
      }

      previousFocus = document.activeElement;

      document.getElementById("modalLabel").textContent = label;
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = body;

      doneButton.textContent = t.close;
      closeButton.setAttribute("aria-label", t.close);

      modal.classList.toggle("wide", Boolean(image));
      modalImage.hidden = !image;

      if (image) {
        modalImage.src = image;
        modalImage.alt = imageAlt;
      } else {
        modalImage.removeAttribute("src");
        modalImage.alt = "";
      }

      backdrop.classList.add("open");
      backdrop.setAttribute("aria-hidden", "false");
      document.body.classList.add("locked");

      app.setAttribute("inert", "");
      modal.scrollTop = 0;
      closeButton.focus();
    }

    function closeModal() {
      backdrop.classList.remove("open");
      document.body.classList.remove("locked");
      app.removeAttribute("inert");

      if (previousFocus && previousFocus.isConnected) {
        previousFocus.focus({ preventScroll: true });
      }

      backdrop.setAttribute("aria-hidden", "true");
    }

    closeButton.addEventListener("click", closeModal);
    doneButton.addEventListener("click", closeModal);

    backdrop.addEventListener("click", event => {
      if (event.target === backdrop) closeModal();
    });

    document.addEventListener("keydown", event => {
      if (!backdrop.classList.contains("open")) return;

      if (event.key === "Escape") {
        event.preventDefault();
        closeModal();
        return;
      }

      if (event.key === "Tab") {
        const focusable = Array.from(modal.querySelectorAll(
          'button:not([disabled]), a[href], input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
        )).filter(element => !element.hidden && element.getClientRects().length > 0);

        if (!focusable.length) {
          event.preventDefault();
          modal.focus();
          return;
        }

        const first = focusable[0];
        const last = focusable[focusable.length - 1];

        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault();
          last.focus();
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault();
          first.focus();
        }
      }
    });

    modalImage.addEventListener("error", () => {
      modalImage.alt = TEXT[language].imageError;
    });

    function setupReveal(skipAnimation = false) {
      if (observer) {
        observer.disconnect();
        observer = null;
      }

      if (
        skipAnimation ||
        reducedMotion.matches ||
        !("IntersectionObserver" in window)
      ) {
        document.documentElement.classList.remove("motion");
        app.querySelectorAll(".reveal").forEach(element => {
          element.classList.add("visible");
        });
        return;
      }

      document.documentElement.classList.add("motion");

      observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add("visible");
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: .06 });

      app.querySelectorAll(".reveal").forEach(element => {
        observer.observe(element);
      });
    }

    function updateProgress() {
      const available = document.documentElement.scrollHeight - window.innerHeight;
      const percent = available > 0
        ? Math.min(100, Math.max(0, window.scrollY / available * 100))
        : 0;

      document.getElementById("progress").style.width = percent + "%";
      scrollScheduled = false;
    }

    window.addEventListener("scroll", () => {
      if (!scrollScheduled) {
        scrollScheduled = true;
        requestAnimationFrame(updateProgress);
      }
    }, { passive: true });

    window.addEventListener("resize", updateProgress);
    window.addEventListener("load", updateProgress);

    app.addEventListener("toggle", updateProgress, true);

    if (typeof reducedMotion.addEventListener === "function") {
      reducedMotion.addEventListener("change", () => setupReveal(true));
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 4000);
    }

    async function sharePage() {
      const t = TEXT[language];

      if (!/^https?:$/.test(window.location.protocol)) {
        showToast(t.localShare);
        return;
      }

      const url = new URL(window.location.href);

      // Индивидуальный код приглашения не передаётся при публичном шеринге.
      url.search = "";
      url.hash = "";

      try {
        if (navigator.share) {
          await navigator.share({
            title: "BRICS Masters Moscow " + CONFIG.eventYear,
            text: t.ctaNote,
            url: url.href
          });
        } else if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url.href);
          showToast(t.copied);
        } else {
          window.prompt(t.copyPrompt, url.href);
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          window.prompt(t.copyPrompt, url.href);
        }
      }
    }

    render();

    // При открытии ссылки с якорем переходим к соответствующему разделу.
    if (window.location.hash) {
      requestAnimationFrame(() => {
        try {
          const id = decodeURIComponent(window.location.hash.slice(1));
          const target = document.getElementById(id);
          if (target) target.scrollIntoView({ behavior: "auto", block: "start" });
        } catch (error) {
          // Некорректный якорь не мешает работе страницы.
        }
      });
    }
  </script>
</body>
</html>
